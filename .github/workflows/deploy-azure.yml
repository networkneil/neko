name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for OIDC federated credentials (workload identity)

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

jobs:
  # ── Step 1: Build and push Docker image to GHCR ─────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Neko image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/neko:${{ github.sha }}
          docker build \
            --target runtime \
            -f server/Dockerfile \
            -t "$IMAGE" \
            -t "ghcr.io/${{ github.repository }}/neko:latest" \
            ./server
          docker push ghcr.io/${{ github.repository }}/neko

  # ── Step 2: Terraform apply (infrastructure) ────────────────────────
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: dev
    needs: build-and-push
    env:
      TF_VAR_environment_name: ${{ vars.ENVIRONMENT_NAME }}
      TF_VAR_location: ${{ vars.LOCATION }}
      TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP }}
      TF_VAR_container_app_name: ${{ vars.CONTAINER_APP_NAME }}
      TF_VAR_neko_image: ghcr.io/${{ github.repository }}/neko:latest
      TF_VAR_neko_http_port: "${{ vars.NEKO_HTTP_PORT }}"
      TF_VAR_neko_webrtc_port_start: "${{ vars.NEKO_WEBRTC_PORT_START }}"
      TF_VAR_neko_webrtc_port_end: "${{ vars.NEKO_WEBRTC_PORT_END }}"
      TF_VAR_neko_shm_size: ${{ vars.NEKO_SHM_SIZE }}
      TF_VAR_neko_cpu_cores: "${{ vars.NEKO_CPU_CORES }}"
      TF_VAR_neko_memory_gb: "${{ vars.NEKO_MEMORY_GB }}"
      TF_VAR_min_replicas: "${{ vars.MIN_REPLICAS }}"
      TF_VAR_max_replicas: "${{ vars.MAX_REPLICAS }}"
      TF_VAR_enable_https: ${{ vars.ENABLE_HTTPS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Azure via Federated Credentials
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -var 'tags={"managed-by":"terraform","project":"neko"}' -input=false -auto-approve

  # ── Step 3: Deploy to Container Apps ────────────────────────────────
  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    environment: dev
    needs: terraform
    steps:
      - name: Login to Azure via Federated Credentials
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        uses: azure/CLI@v3
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ghcr.io/${{ github.repository }}/neko:${{ github.sha }}

      - name: Show deployment URL
        run: |
          echo "Neko deployed successfully!"
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)
          echo "https://$URL"
